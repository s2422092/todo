<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTodo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <!-- 左サイドバー -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="app-name">QuickTodo</span>
      </div>

      <nav class="category-tree" id="category-tree"></nav>

      <button class="btn-add-root-cat" id="btn-add-root-cat">
        <span class="icon">+</span>
        <span>カテゴリーを追加</span>
      </button>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main">
      <div class="main-header">
        <h2 class="current-category-name" id="current-category-name">すべて</h2>
        <span class="shortcut-hint">Alt+Shift+D</span>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="task-input"
          placeholder="タスクを追加..."
          maxlength="100"
          autofocus
        >
      </div>

      <div id="task-list" class="task-list"></div>

      <div id="empty-state" class="empty-state">
        <p>タスクなし</p>
      </div>

      <footer>
        <button id="clear-completed" class="btn-clear">完了済みを削除</button>
      </footer>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
