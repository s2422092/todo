<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTodo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickTodo</h1>
    </header>

    <!-- カテゴリータブ -->
    <div class="category-bar">
      <div id="category-tabs" class="category-tabs"></div>
      <button id="add-category-btn" class="btn-add-category" title="カテゴリーを追加">+</button>
    </div>

    <!-- カテゴリー追加フォーム（通常は非表示） -->
    <div id="category-form" class="category-form hidden">
      <input type="text" id="category-input" placeholder="カテゴリー名を入力..." maxlength="20">
      <button id="category-submit" class="btn-category-submit">追加</button>
      <button id="category-cancel" class="btn-category-cancel">×</button>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="task-input"
        placeholder="タスクを入力してEnter..."
        maxlength="100"
        autofocus
      >
    </div>

    <div id="task-list" class="task-list"></div>

    <div id="empty-state" class="empty-state">
      <p>タスクなし</p>
    </div>

    <footer>
      <button id="clear-completed" class="btn-clear">完了済みを削除</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
