<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px;
    background: #f1f3f4;
    font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .browser {
    width: 1080px; height: 680px;
    background: #dee1e6; border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .browser-bar {
    background: #dee1e6; padding: 10px 16px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .browser-dots { display: flex; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #ffbd2e; }
  .dot-g { background: #28c840; }
  .tab-bar { display: flex; align-items: flex-end; margin-left: 12px; }
  .tab {
    background: #fff; padding: 7px 16px;
    border-radius: 8px 8px 0 0; font-size: 12px; color: #202124;
    display: flex; align-items: center; gap: 8px;
  }
  .tab-favicon { width: 14px; height: 14px; background: #34a853; border-radius: 2px; }
  .omnibox-row {
    background: #dee1e6; padding: 6px 16px 8px;
    display: flex; gap: 8px; align-items: center;
  }
  .omnibox {
    flex: 1; background: #fff; border-radius: 20px;
    padding: 6px 16px; font-size: 13px; color: #3c4043;
  }
  .ext-icon {
    width: 28px; height: 28px; background: #1a73e8; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 11px; font-weight: 700; position: relative;
  }
  .badge-icon {
    position: absolute; top: -4px; right: -4px;
    background: #1a73e8; color: white; font-size: 9px;
    width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #dee1e6;
  }
  .page {
    flex: 1; background: #fff; display: flex;
    align-items: center; justify-content: center;
    position: relative;
  }

  /* Background page */
  .bg-content { width: 100%; height: 100%; padding: 32px 48px; }
  .bg-title { font-size: 20px; color: #202124; margin-bottom: 12px; }
  .bg-line { height: 12px; background: #f1f3f4; border-radius: 4px; margin: 8px 0; }

  /* Popup centered */
  .popup-wrapper {
    position: absolute; top: 30px; right: 48px;
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.18));
  }
  .popup { width: 320px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #dadce0; }
  .popup-header {
    padding: 12px 16px; border-bottom: 1px solid #dadce0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .popup-header h1 { font-size: 14px; font-weight: 500; color: #202124; }
  .popup-hint { font-size: 11px; color: #80868b; }
  .popup-input-area { padding: 10px 12px; border-bottom: 1px solid #dadce0; }
  .popup-input {
    width: 100%; padding: 8px 12px;
    border: 1px solid #dadce0; border-radius: 4px;
    font-size: 13px; color: #9aa0a6; background: #f8f9fa;
  }
  .task-list { padding: 4px 0; }
  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-bottom: 1px solid #f1f3f4;
  }
  .task-item.top { border-left: 3px solid #1a73e8; padding-left: 11px; }
  .task-item.dragging { opacity: 0.35; background: #f8f9fa; }
  .task-item.drag-target { border-top: 2px solid #1a73e8; }
  .handle { color: #9aa0a6; font-size: 11px; letter-spacing: -2px; cursor: grab; }
  .handle.active { color: #1a73e8; cursor: grabbing; }
  .check { width: 16px; height: 16px; border: 2px solid #9aa0a6; border-radius: 2px; flex-shrink: 0; }
  .task-text { flex: 1; font-size: 13px; color: #202124; }
  .badge-top {
    font-size: 10px; font-weight: 500; color: #1a73e8;
    background: #e8f0fe; padding: 1px 6px; border-radius: 10px;
  }
  .del { color: #dadce0; font-size: 15px; }

  /* Ghost drag item */
  .ghost {
    position: absolute; top: 148px; right: 96px;
    width: 296px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: #fff;
    border: 1px solid #1a73e8;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(26,115,232,0.2);
    opacity: 0.9;
    z-index: 10;
    font-size: 13px; color: #202124;
    pointer-events: none;
  }
  .ghost .handle { color: #1a73e8; }

  .popup-footer { padding: 8px 12px; border-top: 1px solid #dadce0; }
  .btn-clear {
    width: 100%; padding: 6px; background: none;
    border: 1px solid #dadce0; border-radius: 4px;
    font-size: 12px; color: #5f6368;
  }

  .task-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 16px; background: #fff;
    border-top: 1px solid #dadce0;
    box-shadow: 0 -1px 4px rgba(0,0,0,0.08);
    font-size: 13px;
  }
  .bar-label { font-size: 11px; font-weight: 500; color: #1a73e8; }
  .bar-text { flex: 1; color: #202124; }
  .bar-shortcut {
    font-size: 11px; color: #9aa0a6; background: #f1f3f4;
    padding: 2px 7px; border-radius: 4px; border: 1px solid #dadce0;
  }
  .bar-close { color: #9aa0a6; font-size: 16px; }
</style>
</head>
<body>
<div class="browser">
  <div class="browser-bar">
    <div class="browser-dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="tab-bar">
      <div class="tab"><div class="tab-favicon"></div>Gmail</div>
    </div>
  </div>
  <div class="omnibox-row">
    <div class="omnibox">mail.google.com/mail/u/0/</div>
    <div class="ext-icon">QT<div class="badge-icon">3</div></div>
  </div>
  <div class="page">
    <div class="bg-content">
      <div class="bg-title">受信トレイ</div>
      <div class="bg-line" style="width:70%"></div>
      <div class="bg-line" style="width:55%"></div>
      <div class="bg-line" style="width:65%"></div>
    </div>

    <div class="popup-wrapper">
      <div class="popup">
        <div class="popup-header">
          <h1>QuickTodo</h1>
          <span class="popup-hint">Alt+Shift+D で最優先完了</span>
        </div>
        <div class="popup-input-area">
          <div class="popup-input">タスクを入力してEnter...</div>
        </div>
        <div class="task-list">
          <div class="task-item top">
            <span class="handle">⋮⋮</span>
            <div class="check"></div>
            <span class="task-text">企画書のレビューを完了させる</span>
            <span class="badge-top">TOP</span>
            <span class="del">×</span>
          </div>
          <!-- drag target indicator -->
          <div class="task-item drag-target" style="padding-top:2px; height:4px; overflow:hidden;"></div>
          <div class="task-item dragging">
            <span class="handle active">⋮⋮</span>
            <div class="check"></div>
            <span class="task-text">デザインの修正をFigmaで反映</span>
            <span class="del">×</span>
          </div>
          <div class="task-item">
            <span class="handle">⋮⋮</span>
            <div class="check"></div>
            <span class="task-text">ミーティングの議事録を送る</span>
            <span class="del">×</span>
          </div>
        </div>
        <div class="popup-footer">
          <button class="btn-clear">完了済みを削除</button>
        </div>
      </div>
      <!-- Ghost item being dragged -->
      <div class="ghost">
        <span class="handle active">⋮⋮</span>
        <div class="check"></div>
        <span style="flex:1; font-size:13px;">デザインの修正をFigmaで反映</span>
      </div>
    </div>

    <div class="task-bar">
      <span class="bar-label">▶ TOP</span>
      <span class="bar-text">企画書のレビューを完了させる</span>
      <span class="bar-shortcut">Alt+Shift+D で完了</span>
      <span class="bar-close">×</span>
    </div>
  </div>
</div>
</body>
</html>
