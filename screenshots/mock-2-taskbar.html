<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px;
    background: #f1f3f4;
    font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .browser {
    width: 1080px; height: 680px;
    background: #dee1e6;
    border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .browser-bar {
    background: #dee1e6;
    padding: 10px 16px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .browser-dots { display: flex; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #ffbd2e; }
  .dot-g { background: #28c840; }
  .tab-bar { display: flex; align-items: flex-end; margin-left: 12px; }
  .tab {
    background: #fff; padding: 7px 16px;
    border-radius: 8px 8px 0 0; font-size: 12px; color: #202124;
    display: flex; align-items: center; gap: 8px;
  }
  .tab-favicon { width: 14px; height: 14px; background: #ea4335; border-radius: 2px; }
  .omnibox-row {
    background: #dee1e6; padding: 6px 16px 8px;
    display: flex; gap: 8px; align-items: center;
  }
  .omnibox {
    flex: 1; background: #fff; border-radius: 20px;
    padding: 6px 16px; font-size: 13px; color: #3c4043;
    display: flex; align-items: center; gap: 6px;
  }
  .ext-icon {
    width: 28px; height: 28px; background: #1a73e8; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 11px; font-weight: 700; position: relative;
  }
  .badge-icon {
    position: absolute; top: -4px; right: -4px;
    background: #1a73e8; color: white; font-size: 9px;
    width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #dee1e6;
  }
  .page {
    flex: 1; background: #fff;
    position: relative; overflow: hidden;
    display: flex;
  }

  /* YouTube-like page */
  .sidebar { width: 240px; background: #fff; padding: 16px 12px; border-right: 1px solid #f1f3f4; }
  .sidebar-item {
    padding: 8px 12px; border-radius: 10px;
    font-size: 13px; color: #0f0f0f;
    display: flex; align-items: center; gap: 12px; margin-bottom: 2px;
  }
  .sidebar-item.active { background: #f2f2f2; font-weight: 500; }
  .sidebar-icon { width: 18px; height: 18px; background: #5f6368; border-radius: 3px; }
  .main { flex: 1; padding: 24px; background: #fff; }
  .main-title { font-size: 18px; font-weight: 400; color: #0f0f0f; margin-bottom: 16px; }
  .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .video-card { cursor: pointer; }
  .thumb { width: 100%; aspect-ratio: 16/9; background: #f1f3f4; border-radius: 8px; margin-bottom: 8px; }
  .thumb-1 { background: linear-gradient(135deg, #e8f0fe, #c5d8fd); }
  .thumb-2 { background: linear-gradient(135deg, #fce8e6, #f5c6c3); }
  .thumb-3 { background: linear-gradient(135deg, #e6f4ea, #b7dfbb); }
  .thumb-4 { background: linear-gradient(135deg, #fef7e0, #fde293); }
  .thumb-5 { background: linear-gradient(135deg, #f3e8fd, #ddb6f7); }
  .thumb-6 { background: linear-gradient(135deg, #e8f5fb, #b3dff0); }
  .video-title { font-size: 12px; color: #0f0f0f; line-height: 1.4; }
  .video-meta { font-size: 11px; color: #606060; margin-top: 2px; }

  /* Task bar - highlighted */
  .task-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 20px;
    background: #fff;
    border-top: 2px solid #1a73e8;
    box-shadow: 0 -2px 8px rgba(26,115,232,0.12);
    font-size: 13px;
  }
  .bar-label { font-size: 11px; font-weight: 600; color: #1a73e8; flex-shrink: 0; }
  .bar-text { flex: 1; color: #202124; font-weight: 500; }
  .bar-shortcut {
    font-size: 11px; color: #9aa0a6;
    background: #f1f3f4; padding: 2px 8px;
    border-radius: 4px; border: 1px solid #dadce0; flex-shrink: 0;
  }
  .bar-close { color: #9aa0a6; font-size: 16px; flex-shrink: 0; }

  /* Callout arrow */
  .callout {
    position: absolute; bottom: 54px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .callout-label {
    background: #1a73e8; color: white;
    font-size: 13px; font-weight: 500;
    padding: 6px 16px; border-radius: 20px;
    white-space: nowrap;
  }
  .callout-arrow {
    width: 2px; height: 16px; background: #1a73e8;
    position: relative;
  }
  .callout-arrow::after {
    content: ''; position: absolute; bottom: -6px; left: -4px;
    border: 5px solid transparent;
    border-top-color: #1a73e8;
  }
</style>
</head>
<body>
<div class="browser">
  <div class="browser-bar">
    <div class="browser-dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="tab-bar">
      <div class="tab">
        <div class="tab-favicon"></div>
        YouTube
      </div>
    </div>
  </div>
  <div class="omnibox-row">
    <div class="omnibox">
      <span style="color:#5f6368; font-size:12px">🔒</span>
      <span>youtube.com</span>
    </div>
    <div class="ext-icon">QT<div class="badge-icon">2</div></div>
  </div>
  <div class="page">
    <div class="sidebar">
      <div class="sidebar-item active"><div class="sidebar-icon"></div>ホーム</div>
      <div class="sidebar-item"><div class="sidebar-icon"></div>ショート</div>
      <div class="sidebar-item"><div class="sidebar-icon"></div>登録チャンネル</div>
      <div class="sidebar-item"><div class="sidebar-icon"></div>ライブラリ</div>
    </div>
    <div class="main">
      <div class="main-title">おすすめ</div>
      <div class="video-grid">
        <div class="video-card"><div class="thumb thumb-1"></div><div class="video-title">デザインの基礎 Vol.3</div><div class="video-meta">123万回視聴</div></div>
        <div class="video-card"><div class="thumb thumb-2"></div><div class="video-title">JavaScript完全入門</div><div class="video-meta">89万回視聴</div></div>
        <div class="video-card"><div class="thumb thumb-3"></div><div class="video-title">生産性を上げる習慣</div><div class="video-meta">45万回視聴</div></div>
        <div class="video-card"><div class="thumb thumb-4"></div><div class="video-title">Figmaの使い方 2025</div><div class="video-meta">67万回視聴</div></div>
        <div class="video-card"><div class="thumb thumb-5"></div><div class="video-title">タスク管理術まとめ</div><div class="video-meta">32万回視聴</div></div>
        <div class="video-card"><div class="thumb thumb-6"></div><div class="video-title">Chrome拡張の作り方</div><div class="video-meta">28万回視聴</div></div>
      </div>
    </div>

    <div class="callout">
      <div class="callout-label">どのページを見ていても常に表示</div>
      <div class="callout-arrow"></div>
    </div>

    <div class="task-bar">
      <span class="bar-label">▶ TOP</span>
      <span class="bar-text">企画書のレビューを完了させる</span>
      <span class="bar-shortcut">Alt+Shift+D で完了</span>
      <span class="bar-close">×</span>
    </div>
  </div>
</div>
</body>
</html>
